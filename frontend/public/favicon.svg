<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glowing orbital rings -->
  <circle cx="50" cy="50" r="42" stroke="url(#cyanTeal)" stroke-width="1.8" opacity="0.4" />
  <circle cx="50" cy="50" r="34" stroke="url(#cyanTeal)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
  
  <!-- Orbital Arc -->
  <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(-30 50 50)" stroke="url(#cyanTeal)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Compass Star -->
  <!-- North -->
  <polygon points="50,14 54,46 50,50" fill="url(#cyanTeal)" filter="url(#glow)" />
  <polygon points="50,14 46,46 50,50" fill="#0d9488" />
  <!-- South -->
  <polygon points="50,86 54,54 50,50" fill="#0d9488" />
  <polygon points="50,86 46,54 50,50" fill="url(#cyanTeal)" filter="url(#glow)" />
  <!-- East -->
  <polygon points="86,50 54,54 50,50" fill="url(#cyanTeal)" filter="url(#glow)" />
  <polygon points="86,50 54,46 50,50" fill="#0d9488" />
  <!-- West -->
  <polygon points="14,50 46,54 50,50" fill="#0d9488" />
  <polygon points="14,50 46,46 50,50" fill="url(#cyanTeal)" filter="url(#glow)" />

  <!-- Center Core -->
  <circle cx="50" cy="50" r="6" fill="#030712" stroke="url(#cyanTeal)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="2.5" fill="#5eead4" filter="url(#glow)" />
  
  <!-- Neural Nodes -->
  <circle cx="28" cy="28" r="2" fill="#38bdf8" />
  <circle cx="72" cy="72" r="2" fill="#38bdf8" />
  <circle cx="72" cy="28" r="2" fill="#2dd4bf" />
  <circle cx="28" cy="72" r="2" fill="#2dd4bf" />
</svg>
